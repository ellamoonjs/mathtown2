<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>정수와 유리수 계산 게임</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      // ⚠️ 여기에 본인의 firebaseConfig 코드를 다시 덮어쓰세요!
      const firebaseConfig ={
  apiKey:"process.env.secret",
  authDomain:"math-pm-game.firebaseapp.com",
  projectId:"math-pm-game",
  storageBucket:"math-pm-game.firebasestorage.app",
  messagingSenderId:"669037026022",
  appId:"1:669037026022:web:1ed055f51052241ce07927",
  measurementId:"G-8X6LYEZFYY"
};

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      window.db = db;
      window.firebaseActions = { collection, addDoc, query, orderBy, limit, getDocs };
    </script>

    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100dvh; margin: 0; background-color: #e9ecef; font-family: 'Malgun Gothic', sans-serif; user-select: none; touch-action: manipulation; }
        #game-container { width: 100%; max-width: 600px; height: 100%; background: white; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; overflow: hidden; display: flex; flex-direction: column; }
        #ui-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #2d3436; color: white; font-size: 20px; font-weight: bold; z-index: 2; position: relative; }
        
        #hearts { color: #ff7675; letter-spacing: 2px; }
        #level-display { color: #74b9ff; }
        #play-area { flex-grow: 1; position: relative; background: #fdfbfb; overflow: hidden; }
        
        /* 💡 콤보 디스플레이 스타일 - 화면 중앙 표시, 흐리게 나타났다 사라짐으로 수정 */
        #combo-display { 
            position: absolute; 
            left: 50%; 
            top: 50%; 
            transform: translate(-50%, -50%); 
            color: #ff9f43; 
            font-size: 32px; /* 화면 중앙이므로 크기 확대 */
            font-weight: 900; 
            opacity: 0; /* 기본 숨김 */
            text-shadow: 0 2px 4px rgba(0,0,0,0.5); /* 그림자 강화 */
            white-space: nowrap; 
            pointer-events: none; 
            z-index: 5; /* 문제 박스보다 위에 보이도록 */
        }
        
        /* 새로운 콤보 애니메이션: 1초 동안 나타났다 흐릿한(0.5) 상태를 유지 후 사라짐(0) */
        @keyframes combo-pop-fade { 
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; } 
            10% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.7; } /* 나타날 때 */
            90% { transform: translate(-50%, -50%) scale(1.0); opacity: 0.5; } /* 흐릿하게 유지 */
            100% { transform: translate(-50%, -50%) scale(1.0); opacity: 0; } /* 사라짐 */
        }
        .combo-anim-fade { 
            animation: combo-pop-fade 1.0s forwards; /* cubic-bezier 제거, forwards 유지 */
        }

        .problem { position: absolute; font-size: 24px; background: white; border: 2px solid #0984e3; padding: 8px 15px; border-radius: 8px; color: #2d3436; box-shadow: 0 4px 6px rgba(0,0,0,0.1); white-space: nowrap; display: flex; justify-content: center; align-items: center; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } }
        .shake-screen { animation: shake 0.3s ease-in-out; background-color: #ffeaa7 !important; }
        #input-display { height: 80px; display: flex; justify-content: center; align-items: center; padding: 0 20px; background: #f1f2f6; font-size: 32px; color: #0984e3; border-top: 2px solid #dfe6e9; z-index: 2; transition: background-color 0.2s; overflow-x: auto; }
        .placeholder { color: #b2bec3; font-size: 20px; font-weight: normal; font-family: 'Malgun Gothic', sans-serif; }
        #keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; background: #dfe6e9; z-index: 2; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
        #keypad button { padding: 15px 0; font-size: 24px; font-weight: bold; border: none; border-radius: 8px; background: white; color: #2d3436; box-shadow: 0 3px 0 #b2bec3; cursor: pointer; transition: background 0.1s; }
        #keypad button:active { transform: translateY(3px); box-shadow: none; background: #f1f2f6; }
        .btn-action { background: #ffeaa7 !important; }
        .btn-submit { background: #0984e3 !important; color: white !important; box-shadow: 0 3px 0 #0652dd !important; }
        
        #game-over, #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        #start-screen { background: white; z-index: 20; }
        #game-over { background: rgba(45, 52, 54, 0.95); color: white; display: none; overflow-y: auto; padding: 20px 0; }
        
        #start-screen h1 { margin-bottom: 10px; color: #2d3436; font-size: 32px; }
        #start-screen p { color: #636e72; margin-bottom: 30px; text-align: center; line-height: 1.6; padding: 0 20px; }
        #game-over h1 { font-size: 45px; margin-bottom: 5px; color: #ff7675; }
        #game-over h2 { font-size: 24px; margin-bottom: 10px; color: #74b9ff; }
        
        #reset-btn { position: absolute; top: 20px; left: 20px; padding: 6px 12px; font-size: 14px; background: #dfe6e9; color: #636e72; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s, color 0.2s; }
        #reset-btn:hover { background: #ff7675; color: white; }
        #high-score-text { font-size: 20px; color: #fdcb6e; margin-top: -5px; margin-bottom: 15px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .new-record { animation: bounce 0.4s ease infinite alternate; color: #ffea00 !important; }
        
        .stats-box { background: rgba(255, 255, 255, 0.1); padding: 15px 25px; border-radius: 12px; margin-bottom: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.2); width: 80%; max-width: 300px;}
        .stats-box p { margin: 0 0 10px 0; font-size: 18px; color: #f1f2f6; }
        .stats-box hr { border: none; border-top: 1px dashed rgba(255,255,255,0.3); margin: 10px 0; }
        #history-list { list-style: none; padding: 0; margin: 0; color: #ffeaa7; font-size: 16px; line-height: 1.5; }

        button.start-btn { padding: 12px 30px; font-size: 20px; font-weight: bold; background: #00b894; color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 0 #008f73; }
        button.start-btn:active { transform: translateY(4px); box-shadow: none; }

        #rank-upload-area { display: flex; gap: 10px; margin-bottom: 15px; }
        .nickname-input { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; width: 130px; text-align: center; outline: none; }
        #ranking-area { background: rgba(0, 0, 0, 0.3); padding: 15px; border-radius: 8px; width: 80%; max-width: 300px; margin-bottom: 15px; }
        .rank-item { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 8px 0; font-size: 16px; }
        .rank-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="start-screen">
        <button id="reset-btn" onclick="resetRecords()">기록 초기화</button>
        <h1>정수와 유리수 계산</h1>
        <p>내려오는 수식의 정답을 입력하세요.<br>연속 정답 시 <strong>콤보 보너스</strong>가 있습니다!<br>분수는 <strong>1/2</strong> 순서로 누르면 입력됩니다.</p>
        <button class="start-btn" onclick="startGame()">게임 시작</button>
    </div>

    <div id="ui-bar">
        <div id="hearts">❤️❤️❤️❤️❤️</div>
        <div id="level-display">Lv.1</div>
        <div id="score">0 점</div>
    </div>
    
    <div id="play-area">
        <div id="combo-display"></div> 
    </div>
    <div id="input-display"><span class="placeholder">정답 입력...</span></div>
    
    <div id="keypad">
        <button onclick="typeKey('1')">1</button>
        <button onclick="typeKey('2')">2</button>
        <button onclick="typeKey('3')">3</button>
        <button class="btn-action" onclick="typeKey('-')">-</button>
        
        <button onclick="typeKey('4')">4</button>
        <button onclick="typeKey('5')">5</button>
        <button onclick="typeKey('6')">6</button>
        <button class="btn-action" onclick="typeKey('/')">분수(/)</button>
        
        <button onclick="typeKey('7')">7</button>
        <button onclick="typeKey('8')">8</button>
        <button onclick="typeKey('9')">9</button>
        <button class="btn-action" onclick="deleteKey()">지우기</button>
        
        <button onclick="typeKey('0')" style="grid-column: span 2;">0</button>
        <button class="btn-submit" onclick="submitAnswer()" style="grid-column: span 2;">입력</button>
    </div>

    <div id="game-over">
        <h1>게임 종료!</h1>
        <h2>최종 점수: <span id="final-score">0</span> 점</h2>
        <h3 id="high-score-text">🏆 내 최고 기록: <span id="high-score">0</span> 점</h3>
        
        <div id="rank-upload-area">
            <input type="text" id="nickname" class="nickname-input" placeholder="닉네임 (최대 6자)" maxlength="6">
            <button onclick="uploadScore()" class="start-btn" style="padding: 10px 15px; font-size: 16px;">랭킹 등록</button>
        </div>

        <div id="ranking-area">
            <p style="margin: 0 0 10px 0; color: #74b9ff; font-weight: bold;">🌍 명예의 전당 (상위 10명)</p>
            <div id="rank-list-content">데이터를 불러오는 중...</div>
        </div>

        <div class="stats-box">
            <p>내 총 도전 횟수: <strong id="total-attempts" style="color:#00b894;">0</strong>회</p>
            <hr>
            <p style="font-size: 14px; color:#b2bec3;">[ 나의 최근 5번 기록 ]</p>
            <ul id="history-list"></ul>
        </div>

        <button class="start-btn" onclick="startGame()" style="margin-bottom: 20px;">다시 시작</button>
    </div>
</div>

<script>
    let score = 0; let lives = 5; let level = 1; let consecutiveCorrect = 0; let speed = 0.4;
    let combo = 0; // 콤보 변수 유지
    let animId; let spawnTimer; let lastTime; let currentInput = ""; let problems = [];

    const playArea = document.getElementById('play-area');
    const inputDisplay = document.getElementById('input-display');
    const heartsDisplay = document.getElementById('hearts');
    const scoreDisplay = document.getElementById('score');
    const levelDisplay = document.getElementById('level-display');
    const comboDisplay = playArea.querySelector('#combo-display'); // 💡 플레이 영역 내부의 콤보 UI
    const gameOverScreen = document.getElementById('game-over');
    const finalScoreDisplay = document.getElementById('final-score');
    const startScreen = document.getElementById('start-screen');

    function resetRecords() {
        if (confirm("정말 나의 기기 게임 기록을 초기화하시겠습니까?\n(명예의 전당 기록은 지워지지 않습니다.)")) {
            localStorage.removeItem('mathGameAttempts');
            localStorage.removeItem('mathGameHistory');
            localStorage.removeItem('mathGameHighScore');
            alert("내 기록이 성공적으로 초기화되었습니다!");
        }
    }

    async function uploadScore() {
        const nickname = document.getElementById('nickname').value.trim();
        if (!nickname) { alert("닉네임을 입력해주세요!"); return; }
        if (!window.firebaseActions) { alert("데이터베이스 연결 중입니다. 잠시 후 다시 시도해주세요."); return; }

        try {
            await window.firebaseActions.addDoc(window.firebaseActions.collection(window.db, "rankings"), {
                name: nickname, score: score, timestamp: new Date()
            });
            alert("명예의 전당에 등록되었습니다!");
            document.getElementById('rank-upload-area').style.display = 'none'; 
            loadRanking(); 
        } catch (e) {
            console.error("오류 발생: ", e); alert("랭킹 등록에 실패했습니다.");
        }
    }

    async function loadRanking() {
        const listContent = document.getElementById('rank-list-content');
        if (!window.firebaseActions) { listContent.innerHTML = "데이터베이스 연결 대기 중..."; return; }
        
        listContent.innerHTML = "데이터를 불러오는 중...";
        try {
            const q = window.firebaseActions.query(window.firebaseActions.collection(window.db, "rankings"), window.firebaseActions.orderBy("score", "desc"), window.firebaseActions.limit(10));
            const querySnapshot = await window.firebaseActions.getDocs(q);
            let html = ""; let rank = 1;
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                html += `<div class="rank-item"><span>${rank}. ${data.name}</span><span style="color: #ffeaa7; font-weight:bold;">${data.score} 점</span></div>`;
                rank++;
            });
            listContent.innerHTML = html || "<div style='text-align:center; padding:10px;'>아직 등록된 랭킹이 없습니다. 1등에 도전하세요!</div>";
        } catch (e) {
            listContent.innerHTML = "<div style='color:#ff7675;'>랭킹을 불러오지 못했습니다.</div>";
        }
    }

    function formatInputToLatex(str) {
        if (!str.includes('/')) return str; 
        let parts = str.split('/');
        let numStr = parts[0]; let denStr = parts.length > 1 ? parts[1] : ''; let sign = '';
        if (numStr.startsWith('-')) { sign = '-'; numStr = numStr.substring(1); }
        let latexNum = numStr === '' ? '\\phantom{0}' : numStr; let latexDen = denStr === '' ? '\\phantom{0}' : denStr;
        return `${sign}\\frac{${latexNum}}{${latexDen}}`;
    }

    function updateDisplay() {
        if (currentInput === "") { inputDisplay.innerHTML = '<span class="placeholder">정답 입력...</span>'; } 
        else { let latex = "\\displaystyle " + formatInputToLatex(currentInput); katex.render(latex, inputDisplay, { throwOnError: false }); }
    }

    // 💡 콤보 화면 업데이트 함수 (JS 로직 수정)
    function updateComboDisplay(bonus = 0) {
        if (combo > 1) {
            comboDisplay.innerText = `${combo} COMBO! (+${bonus})`;
            // 💡 투명도를 직접 조절하는 코드 제거. CSS 애니메이션이 끝에 opacity 0으로 설정되어 있으므로 자연스럽게 처리됨
            comboDisplay.classList.remove('combo-anim-fade'); // 이름 변경
            void comboDisplay.offsetWidth; // 애니메이션 리셋
            comboDisplay.classList.add('combo-anim-fade'); // 이름 변경
        } else {
            // comboDisplay.style.opacity = 0; // 오답 시 콤보 초기화되더라도, 이전 애니메이션이 끝나면서 자연스럽게 사라짐
        }
    }

    function typeKey(key) { currentInput += key; updateDisplay(); }
    function deleteKey() { currentInput = currentInput.slice(0, -1); updateDisplay(); }

    document.addEventListener('keydown', function(e) {
        if (startScreen.style.display !== 'none' || gameOverScreen.style.display === 'flex') return;
        if (e.key >= '0' && e.key <= '9' || e.key === '-' || e.key === '/') typeKey(e.key);
        else if (e.key === 'Backspace') deleteKey();
        else if (e.key === 'Enter') submitAnswer();
    });

    function getRandInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function formatTerm(num, den = 1, isFirst = false) {
        if (den < 0) { num = -num; den = -den; }
        if (den === 1) { if (num < 0 && !isFirst) return `\\left(${num}\\right)`; return `${num}`; }
        let sign = num < 0 ? '-' : ''; let absNum = Math.abs(num);
        let frac = `${sign}\\frac{${absNum}}{${den}}`;
        if (num < 0 && !isFirst) return `\\left(${frac}\\right)`; return frac;
    }

    function createProblemData() {
        let text = ""; let val = 0; let scoreReward = 0; let speedMult = 1.0; 
        
        if (level === 1) { 
            let a = getRandInt(-9, 9); let b = getRandInt(-9, 9); let op = getRandInt(0, 1) ? '+' : '-';
            text = `${formatTerm(a, 1, true)} ${op} ${formatTerm(b, 1)}`; val = op === '+' ? a + b : a - b; 
            scoreReward = 10; speedMult = 1.0; // 정수 계산: 정상 속도
        } else if (level === 2) { 
            let d = getRandInt(2, 7); let a = getRandInt(-9, 9); let b = getRandInt(-9, 9); let op = getRandInt(0, 1) ? '+' : '-';
            text = `${formatTerm(a, d, true)} ${op} ${formatTerm(b, d)}`; val = op === '+' ? (a + b)/d : (a - b)/d; 
            scoreReward = 30; speedMult = 0.65; // 분수 1개: 기존 대비 35% 느려짐
        } else if (level === 3) { 
            let a = getRandInt(-9, 9); let b = getRandInt(-9, 9); let c = getRandInt(-9, 9); let op1 = getRandInt(0, 1) ? '+' : '-'; let op2 = getRandInt(0, 1) ? '+' : '-';
            text = `${formatTerm(a, 1, true)} ${op1} ${formatTerm(b, 1)} ${op2} ${formatTerm(c, 1)}`;
            let temp = op1 === '+' ? a + b : a - b; val = op2 === '+' ? temp + c : temp - c; 
            scoreReward = 50; speedMult = 0.9; // 3개 정수: 기존 대비 10% 느려짐
        } else if (level === 4) { 
            let d = getRandInt(2, 7); let a = getRandInt(-9, 9); let b = getRandInt(-9, 9); let c = getRandInt(-9, 9); let op1 = getRandInt(0, 1) ? '+' : '-'; let op2 = getRandInt(0, 1) ? '+' : '-';
            text = `${formatTerm(a, d, true)} ${op1} ${formatTerm(b, d)} ${op2} ${formatTerm(c, d)}`;
            let temp = op1 === '+' ? a + b : a - b; val = op2 === '+' ? (temp + c)/d : (temp - c)/d; 
            scoreReward = 70; speedMult = 0.55; // 3개 분수: 45% 느려짐
        } else { 
            let d1 = getRandInt(2, 5); let d2 = getRandInt(2, 5); let d3 = getRandInt(2, 5); let a = getRandInt(-5, 5); let b = getRandInt(-5, 5); let c = getRandInt(-5, 5); let op1 = getRandInt(0, 1) ? '+' : '-'; let op2 = getRandInt(0, 1) ? '+' : '-';
            text = `${formatTerm(a, d1, true)} ${op1} ${formatTerm(b, d2)} ${op2} ${formatTerm(c, d3)}`;
            let v1 = a/d1, v2 = b/d2, v3 = c/d3; let temp = op1 === '+' ? v1 + v2 : v1 - v2; val = op2 === '+' ? temp + v3 : temp - v3; 
            scoreReward = 100; speedMult = 0.45; // 혼합 분수: 55% 느려짐 (제일 느림)
        }
        return { text, val, scoreReward, speedMult };
    }

    function spawnProblem() {
        if (lives <= 0) return;
        let data = createProblemData();
        let el = document.createElement('div'); el.className = 'problem'; 
        
        // 💡 충돌 체크를 위해 엘리먼트를 먼저 DOM에 추가하고 너비를 구해야 함
        el.style.visibility = 'hidden'; // 임시 숨김
        playArea.appendChild(el);
        katex.render("\\displaystyle " + data.text, el, { throwOnError: false });
        
        // 💡 엘리먼트의 실제 너비와 높이 측정
        const newWidth = el.offsetWidth;
        el.style.visibility = 'visible'; // 다시 보임

        // 💡 충돌 방지 로직 (문제끼리 겹치지 않게 안전한 left 위치 찾기)
        let potential_left = 0;
        let is_safe = false;
        let attempts = 0;
        const playAreaWidth = playArea.clientWidth;

        while (!is_safe && attempts < 20) { // 최대 20회 시도
            attempts++;
            // potential_left 범위를 안전하게 설정 (Math.max 추가, newWidth가 playAreaWidth보다 크면 random range error 발생)
            potential_left = getRandInt(10, Math.max(10, playAreaWidth - newWidth - 10)); 
            is_safe = true; // 안전하다고 가정

            // 💡 현재 하락 중인 다른 문제들과 위치 비교 (수평 영역이 겹치는지 체크)
            for (let i = 0; i < problems.length; i++) {
                let p = problems[i];
                let other_left = p.el.offsetLeft;
                let other_width = p.width; // p. width를 사용

                // 수평 영역이 겹치는지 확인
                if (potential_left < other_left + other_width && potential_left + newWidth > other_left) {
                    // 수평 영역이 겹치면 충돌 발생
                    is_safe = false; 
                    break; // 더 이상 다른 문제와 비교할 필요 없음
                }
            }
        }
        
        // 💡 attempts가 20회 넘으면 그냥 마지막 랜덤 위치를 사용 (플레이 영역이 꽉 차면 어쩔 수 없이 겹침 발생)
        el.style.left = potential_left + 'px'; 
        el.style.top = '-80px'; 
        
        // 💡 너비(`offsetWidth`)를 problem 객체에 저장
        problems.push({ el: el, val: data.val, scoreReward: data.scoreReward, y: -80, speedMult: data.speedMult, width: newWidth });
    }

    function parseAnswer(str) {
        if (!str) return null;
        if (str.includes('/')) {
            let parts = str.split('/');
            if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1]) && parts[0] !== "" && parts[1] !== "") {
                let num = parseFloat(parts[0]); let den = parseFloat(parts[1]);
                if (den === 0) return null; return num / den;
            }
        } else { if (!isNaN(str) && str !== '-' && str !== '') return parseFloat(str); }
        return null;
    }

    function update() {
        if (lives <= 0) return;
        let now = Date.now(); let dt = now - lastTime; let baseMoveSpeed = speed * (dt / 16.66); lastTime = now;
        for (let i = problems.length - 1; i >= 0; i--) {
            let p = problems[i]; 
            // 💡 문제마다 할당된 속도 배율을 곱해서 하강 속도 결정 (분수 계산 시간 확보)
            p.y += baseMoveSpeed * p.speedMult; 
            p.el.style.top = p.y + 'px';
            
            if (p.y > playArea.clientHeight - 60) { 
                p.el.remove(); problems.splice(i, 1); 
                combo = 0; updateComboDisplay(0); // 바닥에 닿으면 콤보 초기화 (로직 유지)
                loseLife(); consecutiveCorrect = 0; 
            }
        }
        animId = requestAnimationFrame(update);
    }

    function loseLife() {
        lives--; updateUI();
        inputDisplay.classList.add('shake-screen'); setTimeout(() => inputDisplay.classList.remove('shake-screen'), 300);
        if (lives <= 0) endGame();
    }

    function updateUI() {
        let h = ""; for (let i = 0; i < 5; i++) h += (i < lives) ? "❤️" : "🤍";
        heartsDisplay.innerText = h; scoreDisplay.innerText = `${score} 점`; levelDisplay.innerText = `Lv.${level}`;
    }

    function levelUpCheck() {
        consecutiveCorrect++;
        if (consecutiveCorrect >= 5) { consecutiveCorrect = 0; if (level < 5) { level++; speed += 0.1; } }
        updateUI();
    }

    function submitAnswer() {
        let userVal = parseAnswer(currentInput);
        if (userVal !== null) {
            let matchedIdx = -1; let maxY = -Infinity;
            for (let i = 0; i < problems.length; i++) {
                if (Math.abs(problems[i].val - userVal) < 0.0001) { if (problems[i].y > maxY) { maxY = problems[i].y; matchedIdx = i; } }
            }
            if (matchedIdx !== -1) {
                let p = problems[matchedIdx]; 
                
                // 콤보 로직 및 보너스 점수 부여 (유지)
                combo++;
                let comboBonus = (combo > 1) ? (combo - 1) * 5 : 0; 
                score += p.scoreReward + comboBonus;
                
                p.el.remove(); problems.splice(matchedIdx, 1); levelUpCheck();
                updateComboDisplay(comboBonus);

            } else { 
                combo = 0; updateComboDisplay(0); // 오답 시 콤보 초기화
                loseLife(); consecutiveCorrect = 0; 
            }
        }
        currentInput = ""; updateDisplay();
    }

    function startGame() {
        startScreen.style.display = 'none'; gameOverScreen.style.display = 'none';
        problems.forEach(p => p.el.remove()); problems = [];
        score = 0; lives = 5; level = 1; consecutiveCorrect = 0; speed = 0.4; currentInput = "";
        combo = 0; updateComboDisplay(0); // 콤보 초기화
        document.getElementById('nickname').value = ''; 
        updateUI(); updateDisplay();
        if (spawnTimer) clearInterval(spawnTimer); spawnTimer = setInterval(spawnProblem, 4000);
        lastTime = Date.now(); cancelAnimationFrame(animId); update();
    }

    function endGame() {
        clearInterval(spawnTimer);
        cancelAnimationFrame(animId);
        finalScoreDisplay.innerText = score;

        let totalAttempts = parseInt(localStorage.getItem('mathGameAttempts') || '0');
        let history = JSON.parse(localStorage.getItem('mathGameHistory') || '[]');
        let storedHighScore = parseInt(localStorage.getItem('mathGameHighScore') || '0');
        let maxInHistory = history.length > 0 ? Math.max(...history) : 0;
        let trueHighScore = Math.max(storedHighScore, maxInHistory);
        const highScoreTextEl = document.getElementById('high-score-text');

        if (score > trueHighScore) {
            trueHighScore = score;
            highScoreTextEl.innerHTML = `🎉 내 신기록 달성!: <span id="high-score">${trueHighScore}</span> 점 🎉`;
            highScoreTextEl.classList.add('new-record');
        } else {
            highScoreTextEl.innerHTML = `🏆 내 최고 기록: <span id="high-score">${trueHighScore}</span> 점`;
            highScoreTextEl.classList.remove('new-record');
        }

        localStorage.setItem('mathGameHighScore', trueHighScore);
        totalAttempts++; history.push(score);
        localStorage.setItem('mathGameAttempts', totalAttempts);
        localStorage.setItem('mathGameHistory', JSON.stringify(history));

        document.getElementById('total-attempts').innerText = totalAttempts;
        let historyList = document.getElementById('history-list'); historyList.innerHTML = '';
        let recentHistory = history.slice(-5);
        recentHistory.reverse().forEach((s, index) => {
            let li = document.createElement('li'); let attemptNum = totalAttempts - index;
            li.innerText = `${attemptNum}회차: ${s} 점`; historyList.appendChild(li);
        });

        document.getElementById('rank-upload-area').style.display = 'flex';
        gameOverScreen.style.display = 'flex';
        setTimeout(() => loadRanking(), 500); 
    }
</script>
